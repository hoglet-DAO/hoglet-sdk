name: Skills

on:
  push:
    paths:
      - "skills/**"
      - "scripts/validate-skills.mjs"
      - "scripts/pack-skills.mjs"
      - "package.json"
      - "pnpm-lock.yaml"
      - ".github/workflows/skills.yml"
    tags:
      - "skills-v*"
  pull_request:
    paths:
      - "skills/**"
      - "scripts/validate-skills.mjs"
      - "scripts/pack-skills.mjs"
      - "package.json"
      - "pnpm-lock.yaml"
      - ".github/workflows/skills.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm skills:ci

      - uses: actions/upload-artifact@v4
        with:
          name: hoglet-agent-skills
          path: artifacts/*
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/skills-v')
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: hoglet-agent-skills
          path: artifacts

      - uses: softprops/action-gh-release@v2
        with:
          name: Hoglet Agent Skills ${{ github.ref_name }}
          tag_name: ${{ github.ref_name }}
          files: |
            artifacts/hoglet-agent-skills.zip
            artifacts/hoglet-agent-skills.zip.sha256
          make_latest: true
